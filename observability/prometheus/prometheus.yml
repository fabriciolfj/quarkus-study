global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: quarkus-micrometer-demo

scrape_configs:

  - job_name: 'quarkus-app'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['quarkus-app:8080']
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
